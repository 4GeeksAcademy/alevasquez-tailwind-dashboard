<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard moved</title>
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <script>
      window.location.replace("./index.html");
    </script>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(160deg, #f8fafc, #e2e8f0);
        color: #0f172a;
      }
      main {
        max-width: 38rem;
        padding: 1.25rem;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      }
      a {
        color: #0f766e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dashboard moved to index.html</h1>
      <p>
        This file is deprecated to avoid duplicate dashboard sources. You are being
        redirected now.
      </p>
      <p>
        If redirect does not run, open
        <a href="./index.html">index.html</a>.
      </p>
    </main>
  </body>
</html>
